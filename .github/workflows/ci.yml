name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Lint shell scripts
        run: |
          brew install shellcheck
          shellcheck sysdata scripts/*.sh
      - name: Render icon
        run: scripts/make-icon.sh
