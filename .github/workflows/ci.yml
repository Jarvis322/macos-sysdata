name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build -c release

      - name: Test
        # The machine-wide scan stays off: a GitHub runner ships Xcode and its
        # simulator runtimes, so it is no faster there than on a developer Mac.
        run: swift test

      - name: Assemble the app bundle
        run: scripts/build-app.sh

      - name: Check the bundle is complete
        run: |
          app=build/SysDataMenu.app
          test -x "$app/Contents/MacOS/SysDataMenu"
          test -f "$app/Contents/Info.plist"
          test -d "$app/Contents/Resources/SysDataMenu_SysDataMenu.bundle"
          codesign --verify --deep --strict "$app"

      - name: Check the compiled strings are up to date
        # compile-strings.sh regenerates the .strings files from the catalog;
        # a stale commit shows up here instead of as mixed languages at runtime.
        run: |
          scripts/compile-strings.sh
          git diff --exit-code -- Sources/SysDataMenu/Resources
